<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ametium Utility Mod</title>
    <meta name="description" content="An addon for Meteor Client that adds advanced modules to Minecraft.">
    <meta name="theme-color" content="#5a0096">
    <link rel="icon" type="image/png" href="ametium.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #5a0096;
            --purple-a60: rgba(90, 0, 150, 0.6);
            --purple-a90: rgba(90, 0, 150, 0.9);
            --text: #ffffff;
            --muted: #cfcfd6;
            --line: rgba(255, 255, 255, 0.14);
        }
        * { box-sizing: border-box; margin: 0; }
        html { height: 100%; }
        body {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            color: var(--text);
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Fondo: degradado animado. El lado izquierdo se mantiene oscuro para que se lea el texto */
        .bg {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background: linear-gradient(115deg, #0a0a0a 0%, #0a0a0a 40%, rgba(90, 0, 150, 0.3) 100%), #0a0a0a;
        }
        .bg .sweep {
            position: absolute; left: 72%; top: 50%;
            width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax;
            background: conic-gradient(from 0deg,
                transparent 0deg, rgba(90, 0, 150, 0.65) 55deg, transparent 125deg,
                transparent 200deg, rgba(90, 0, 150, 0.45) 270deg, transparent 340deg);
            filter: blur(70px);
            animation: spin 50s linear infinite;
            will-change: transform;
        }
        .bg .pulse {
            position: absolute; right: -15vmax; bottom: -20vmax;
            width: 70vmax; height: 70vmax;
            background: radial-gradient(circle, rgba(90, 0, 150, 0.6) 0%, transparent 65%);
            animation: breathe 9s ease-in-out infinite alternate;
        }
        .bg::after {
            content: '';
            position: absolute; inset: 0;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.5) 50%, transparent 100%),
                linear-gradient(0deg, rgba(0, 0, 0, 0.6) 0%, transparent 30%);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes breathe { from { transform: scale(0.85); opacity: 0.6; } to { transform: scale(1.1); opacity: 1; } }


        /* Barra de navegación flotante */
        .nav {
            position: fixed; top: 1rem; left: 1rem; right: 1rem; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.55rem 1rem;
            background: rgba(255, 255, 255, 0.07);
            -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: padding 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s, box-shadow 0.4s;
        }
        .nav.scrolled {
            padding: 0.3rem 0.85rem;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .nav-brand { display: flex; align-items: center; gap: 0.5rem; color: #fff; text-decoration: none; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.02em; }
        /* El PNG tiene margen transparente: se recorta para que el globo ocupe el espacio */
        .nav-logo { position: relative; width: 22px; height: 32px; overflow: hidden; flex-shrink: 0; }
        .nav-logo img { position: absolute; width: 48px; height: 48px; left: -12.5px; top: -6.2px; max-width: none; }
        .nav-links { display: flex; align-items: center; gap: 0.25rem; }
        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.65);
            transition: color 0.2s, background-color 0.2s, border-color 0.2s;
        }
        .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }
        .icon-btn:hover { color: #fff; background: var(--purple); border-color: var(--purple); }
        .icon-btn:focus-visible, .nav-brand:focus-visible, footer a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

        main { flex: 1; display: flex; align-items: center; padding: 5.5rem clamp(1.5rem, 7vw, 7rem) 2.5rem; }
        .wrap { width: 100%; max-width: 40rem; margin: 0; text-align: left; }

        .logo {
            --size: 200px;
            display: block; width: var(--size); height: var(--size);
            margin: calc(var(--size) * -0.12) 0 calc(var(--size) * -0.16) calc(var(--size) * -0.33);
            filter: drop-shadow(0 0 16px var(--purple-a90));
        }

        .badge {
            display: inline-block;
            margin-top: 1.75rem;
            padding: 0.3rem 0.9rem;
            border-radius: 999px;
            background: var(--purple);
            box-shadow: 0 0 22px var(--purple-a90);
            color: #fff;
            font-size: 0.8125rem;
            font-weight: 600;
        }

        h1 {
            margin-top: 1rem;
            font-size: clamp(2.5rem, 9vw, 4.5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.025em;
        }
        .brand { color: var(--purple); text-shadow: 0 0 40px var(--purple-a90); }

        .lead { margin-top: 1.25rem; max-width: 30rem; color: var(--muted); font-size: 1.125rem; }

        .actions { margin-top: 2.25rem; display: flex; flex-wrap: wrap; gap: 0.9rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.6rem;
            padding: 0.95rem 1.7rem;
            border-radius: 12px;
            border: 2px solid var(--purple);
            color: #fff;
            font-size: 1rem; font-weight: 600; text-decoration: none;
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 24px var(--purple-a60);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
        .btn:hover { transform: translateY(-2px); background: var(--purple); box-shadow: 0 0 44px var(--purple-a90); }
        .btn-primary {
            background: var(--purple);
            box-shadow: 0 0 36px var(--purple-a90), 0 0 80px var(--purple-a60);
            animation: glow 3s ease-in-out infinite;
        }
        .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 28px var(--purple-a90), 0 0 60px var(--purple-a60); }
            50%      { box-shadow: 0 0 48px var(--purple-a90), 0 0 110px var(--purple-a90); }
        }

        .stats {
            margin-top: 2.25rem;
            display: inline-flex; flex-wrap: wrap; gap: 0.25rem 1.5rem;
            padding: 0.7rem 1.1rem;
            border: 1px solid var(--purple);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 28px var(--purple-a60);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            font-size: 0.9375rem;
        }
        .stats[hidden] { display: none; }
        .stats b { font-weight: 700; }
        .dot {
            display: inline-block; width: 9px; height: 9px; margin-right: 0.5rem;
            border-radius: 50%; background: #fff; box-shadow: 0 0 10px 2px var(--purple);
        }

        footer {
            position: relative;
            padding: 1.25rem clamp(1.5rem, 7vw, 7rem);
            box-shadow: 0 -8px 40px var(--purple-a60);
            background: rgba(0, 0, 0, 0.5);
            color: var(--muted); font-size: 0.875rem; text-align: left;
        }
        footer::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, rgba(90, 0, 150, 0.25), var(--purple), rgba(90, 0, 150, 0.25), var(--purple), rgba(90, 0, 150, 0.25));
            background-size: 200% 100%;
            animation: slide 6s linear infinite;
        }
        @keyframes slide { to { background-position: -200% 0; } }
        footer p + p { margin-top: 0.15rem; }
        footer a { color: #fff; font-weight: 600; text-decoration: underline; text-decoration-color: var(--purple); text-decoration-thickness: 2px; text-underline-offset: 4px; }
        footer a:hover { background: var(--purple); text-decoration-color: transparent; }
        footer .legal { margin-top: 0.6rem; font-size: 0.75rem; opacity: 0.7; }

        @media (max-width: 768px) {
            .nav { left: 8px; right: 8px; }
            .bg::after { background: linear-gradient(180deg, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.78) 45%, rgba(0, 0, 0, 0.25) 100%); }
        }
        @media (max-width: 480px) { .btn { flex: 1 1 100%; justify-content: center; } }
        @media (prefers-reduced-motion: reduce) { .btn-primary, .bg .sweep, .bg .pulse, footer::before { animation: none; } .btn { transition: none; } }
    </style>
</head>
<body>
<div class="bg" aria-hidden="true">
    <div class="sweep"></div>
    <div class="pulse"></div>
</div>

<nav class="nav" id="nav">
    <a class="nav-brand" href="/">
        <span class="nav-logo"><img src="ametium.png" alt=""></span>
        <span>Ametium</span>
    </a>
    <div class="nav-links">
        <a class="icon-btn" href="https://discord.gg/ametium" target="_blank" rel="noopener noreferrer" aria-label="Discord"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg></a>

    </div>
</nav>

<main>
    <div class="wrap">
        <img class="logo" src="ametium.png" alt="Ametium logo" width="200" height="200">
        <span class="badge">Meteor Client addon</span>
        <h1><span class="brand">Ametium</span> Utility Mod</h1>
        <p class="lead">Advanced modules for Minecraft, built to run on Meteor Client.</p>

        <div class="actions">
            <a class="btn btn-primary" href="https://discord.gg/ametium" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Join our Discord
            </a>
            <a class="btn" href="https://youtube.com/@itsdarexmc" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                Watch on YouTube
            </a>
        </div>

        <p class="stats" id="stats" hidden>
            <span><b id="total-members"></b> members</span>
            <span><span class="dot" aria-hidden="true"></span><b id="online-members"></b> online</span>
        </p>
    </div>
</main>

<footer>
    <p>Download addon on our official <a href="https://discord.gg/ametium" target="_blank" rel="noopener noreferrer">Discord</a></p>
    <p>Created by ItsDarexMC</p>
    <p class="legal">© 2026 Ametium Development</p>
</footer>

<script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 30), { passive: true });

    async function updateDiscordStats() {
        try {
            const res = await fetch('https://discord.com/api/v9/invites/ametium?with_counts=true');
            const data = await res.json();
            document.getElementById('total-members').textContent = data.approximate_member_count.toLocaleString();
            document.getElementById('online-members').textContent = data.approximate_presence_count.toLocaleString();
            document.getElementById('stats').hidden = false;
        } catch (e) {}
    }
    updateDiscordStats();
    setInterval(updateDiscordStats, 60000);
</script>
